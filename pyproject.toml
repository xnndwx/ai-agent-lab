[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-lab"
version = "0.2.0"
description = "本地 Ollama（约 3B）上手写 Agent 学习骨架：week01 单工具循环 + week02 多工具注册与会话"
readme = "README.md"
requires-python = ">=3.10"
# 仍只用标准库访问 Ollama，不引入 LangChain / LangGraph
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
week01 = "week01.main:main"
week02 = "week02.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
